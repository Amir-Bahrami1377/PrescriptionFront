# LOCAL ONLY — builds from source and publishes a port so you can poke at the production
# image on your own machine. Never run this file on the server: use docker-compose.prod.yml,
# which pulls a pinned image and publishes nothing (Caddy owns 80/443 there).
services:
  prescription-frontend:
    build:
      context: .
      args:
        VITE_PRESCRIPTION_API_BASE_URL: ${VITE_PRESCRIPTION_API_BASE_URL:-}
    container_name: prescription-frontend
    ports:
      - "8081:80"
    restart: unless-stopped
